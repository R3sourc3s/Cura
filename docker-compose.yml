services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: empathika
      POSTGRES_USER: empathika
      POSTGRES_PASSWORD: empathika
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empathika"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: empathika.settings.development
      DATABASE_URL: postgres://empathika:empathika@db:5432/empathika
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn empathika.wsgi:application --bind 0.0.0.0:8000 --workers 4 --reload"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: empathika.settings.development
      DATABASE_URL: postgres://empathika:empathika@db:5432/empathika
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
    command: celery -A empathika worker -l info

  # Marketing site (existing Next.js at root)
  marketing:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development

volumes:
  postgres_data:
  backend_static:
  backend_media:
