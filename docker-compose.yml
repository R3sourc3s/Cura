services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cura
      POSTGRES_USER: cura
      POSTGRES_PASSWORD: cura
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cura"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: cura.settings.development
      DATABASE_URL: postgres://cura:cura@db:5432/cura
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn cura.wsgi:application --bind 0.0.0.0:8000 --workers 4 --reload"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: cura.settings.development
      DATABASE_URL: postgres://cura:cura@db:5432/cura
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
    command: celery -A cura worker -l info

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install --prefer-offline --no-audit; npm run dev"
    environment:
      NODE_ENV: development
      API_URL: http://backend:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_static:
  backend_media:
