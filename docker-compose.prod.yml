services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cura
      POSTGRES_USER: cura
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cura"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/r3sourc3s/cura/backend:latest
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn cura.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery:
    image: ghcr.io/r3sourc3s/cura/backend:latest
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      backend:
        condition: service_healthy
    command: celery -A cura worker --beat -l info

  frontend:
    image: ghcr.io/r3sourc3s/cura/frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      API_URL: http://backend:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # The frontend's own AI routes (src/app/api/ai/*) call OpenAI directly,
      # separate from the backend's Anthropic-based ai_assistant app. This was
      # missing here — dev's docker-compose.yml has it, prod didn't — so the
      # chat/compliance-report/risk-score/care-plan-summary/transcription
      # features would silently 503 in a real deploy. Reads from the root
      # .env file (docker compose's own convention), same as dev.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
